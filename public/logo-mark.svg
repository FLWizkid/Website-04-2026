<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White background - tight fit -->
  <circle cx="50" cy="50" r="50" fill="#FFFFFF"/>

  <!-- Dark blue left circle - fills left half -->
  <circle cx="35" cy="50" r="38" fill="#0047A3"/>

  <!-- Teal right circle - fills right half -->
  <circle cx="65" cy="50" r="38" fill="#14B8A6"/>

  <!-- Dark blue accent - small detail -->
  <circle cx="25" cy="75" r="14" fill="#001D47"/>
</svg>
